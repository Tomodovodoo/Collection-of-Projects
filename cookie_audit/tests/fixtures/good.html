<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Fixture — good</title><style>body{font-family:Arial;margin:0;background:#eee} main{padding:40px}.banner{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #ccc;padding:25px;z-index:5}button{border:0;padding:14px 28px;font-size:16px;background:#183f68;color:white;border-radius:4px;cursor:pointer;margin-right:10px}.reject{background:#296d4d;color:white}</style></head><body><main><h1>Test website</h1>Example content.</main><div class="banner" id="cookie-banner"><h2>Cookies en privacy</h2><p>Wij vragen toestemming voor het gebruik van tracking cookies voor advertenties.</p><button id="accept">Accepteer alles</button><button class="reject" id="reject">Weiger alles</button></div><script>if(localStorage.getItem('choice'))document.getElementById('cookie-banner').style.display='none';for(const action of ['accept','reject'])document.getElementById(action).addEventListener('click',()=>{localStorage.setItem('choice',action);document.getElementById('cookie-banner').style.display='none'});</script></body></html>
