<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Fixture — hidden link</title><style>body{font-family:Arial;margin:0}main{padding:40px}.banner{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #ccc;padding:25px;z-index:5}button{border:0;padding:17px 38px;font-size:16px;background:#183f68;color:white;cursor:pointer;margin-right:10px}.privacytext{font-size:12px;max-width:650px;line-height:1.8}a{color:#6e7376;text-decoration:underline}</style></head><body><main><h1>Test website</h1></main><div class="banner" id="cookie-banner"><h2>Cookies en privacy</h2><p>Wij gebruiken tracking cookies voor advertenties.</p><button id="accept">Accepteer alles</button><p class="privacytext">Je kunt ook de privacyverklaring lezen en <a href="#" id="reject">Weiger alles</a>, als je dat liever wilt doen.</p></div><script>if(localStorage.getItem('choice'))document.getElementById('cookie-banner').style.display='none';document.getElementById('reject').onclick=e=>{e.preventDefault();localStorage.setItem('choice','reject');document.getElementById('cookie-banner').style.display='none'};document.getElementById('accept').onclick=()=>{localStorage.setItem('choice','accept');document.getElementById('cookie-banner').style.display='none'};</script></body></html>
