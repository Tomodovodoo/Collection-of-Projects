<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Fixture — extra rejection step</title><style>body{font-family:Arial;margin:0}main{padding:40px}.banner{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #ccc;padding:25px;z-index:5}button{border:0;padding:14px 28px;font-size:16px;background:#183f68;color:white;cursor:pointer;margin-right:10px}.no{background:#296d4d}</style></head><body><main><h1>Test website</h1></main><div class="banner" id="cookie-banner"><h2>Cookies en privacy</h2><p>Onze tracking cookies zorgen voor gepersonaliseerde advertenties.</p><section id="first"><button id="accept">Accepteer alles</button><button id="settings">Instellingen</button></section><section id="second" style="display:none"><p>Pas uw cookievoorkeuren aan.</p><button class="no" id="reject">Weiger alles</button></section></div><script>if(localStorage.getItem('choice'))document.getElementById('cookie-banner').style.display='none';document.getElementById('settings').onclick=()=>{document.getElementById('first').style.display='none';document.getElementById('second').style.display='block'};document.getElementById('reject').onclick=()=>{localStorage.setItem('choice','reject');document.getElementById('cookie-banner').style.display='none'};document.getElementById('accept').onclick=()=>{localStorage.setItem('choice','accept');document.getElementById('cookie-banner').style.display='none'};</script></body></html>
